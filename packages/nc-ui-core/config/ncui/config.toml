[general]
hover_tooltip_delay = 0.7
language = "en" # "en", "it", or any <lang>.toml in locales/ or ~/.config/ncui/locales/
log_file = "/tmp/nc-ui.log"
log_level = 3
enable_hover_tooltips = true
terminal = "auto" # "auto" searches installed terminals (ghostty, kitty, foot, alacritty, ...)
pkg_manager = "auto" # "auto", "paru", "yay", "pacman", "apt", "dnf", "zypper"

[control_center]
hide_unavailable_settings = false
panel_style = "standard"
width_px = 960
side = "right" # "left" or "right"
inner_padding = 10
outer_margin = 8

[capture]
action = "clipboard_satty" # "clipboard" | "satty" | "save" | "clipboard_satty"

[panels.refresh_ms]
calendar      = 0
notifications = 1500
ram           = 1000
cpu           = 1000
gpu           = 1000
network       = 1500
audio         = 1500
capture       = 0
display       = 2000
clipboard     = 1500
power         = 3000
ups           = 3000
kb_layout     = 2000
storage       = 5000
session       = 0

[network]
# "auto" monitors all active physical interfaces and tunnels
monitored_interfaces = "auto"
default_speed_unit = "bytes" # "bytes" (kB/s, MB/s) or "bits" (kb/s, Mb/s)
show_bar_speed = false       # true shows download/upload and interface on Waybar; false shows compact status icons

[network.wan]
# Leave primary_ip = "" on generic hosts to disable dual-WAN failover tracking
primary_ip = ""
primary_label = "Primary WAN"
failover_label = "Failover WAN"

# Watchdog nodes monitored in Network -> WAN & Routing. If empty, uses Default Gateway + 1.1.1.1
watchdog = []

[power.nut]
enabled = false
host = "127.0.0.1"
port = 3493
ups_name = ""
poll_interval = 5
low_pct = 20

[storage.nas]
enabled = false
host = ""
ssh_user = ""

[waybar_plugins]
lock_cmd = ""
media_width_pct = 35
window_width_pct = 45

[wallpaper]
# Optional explicit path to the nc-matrix binary; leave empty to auto-detect from PATH.
nc_matrix_bin = ""
