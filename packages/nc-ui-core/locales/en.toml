[privileges.uinput_unlock]
title = "Kernel /dev/uinput Access (Gaming Macros)"
desc = "Grants write permission (0666) on /dev/uinput for hardware macro replay."
warn = "Allows your user account to inject virtual keystrokes via /dev/uinput without password."

[privileges.nftables_apply]
title = "Apply nftables Firewall Ruleset"
desc = "Loads validated /etc/nftables.conf into the kernel packet filter."
warn = "Permits reloading /etc/nftables.conf into kernel nftables without password prompt."

[privileges.nftables_service]
title = "Manage nftables Systemd Service"
desc = "Allows starting and restarting nftables.service via systemd."
warn = "Permits starting or restarting nftables.service without interactive password."

[privileges.sbctl_verify]
title = "Secure Boot & UKI Signature Verification"
desc = "Reads UEFI Secure Boot status and verifies signed UKI images."
warn = "Grants read-only inspection access to sbctl status and signature checks."

[privileges.usbguard_inspect]
title = "USBGuard Device Policy Manager (nc-usbguard)"
desc = "Lists USB devices and allows or blocks them via /usr/lib/ncui/sbin/nc-usbguard."
warn = "Grants USBGuard device listing and allow/block authorization without interactive password."

[privileges.cups_service]
title = "Manage CUPS & Avahi Print Services"
desc = "Allows starting, stopping, restarting, and enabling cups.service and avahi-daemon.service."
warn = "Permits controlling CUPS and Avahi systemd services without interactive password."

[privileges.cups_sysgroup]
title = "Enroll User in CUPS Admin Group (sys, lp)"
desc = "Adds your account to sys and lp so local CUPS socket commands authenticate natively."
warn = "Grants local CUPS SystemGroup membership (re-login activates group token)."

[privileges.power_cpu_tune]
title = "CPU Frequency Governor & Boost Tuning"
desc = "Allows changing CPU governor via cpupower and toggling CPU boost via sysfs."
warn = "Permits adjusting CPU scaling governor and boost state without password prompt."

[privileges.power_logind]
title = "Power Button Policy (systemd-logind)"
desc = "Writes HandlePowerKey policy to /etc/systemd/logind.conf.d/ncui.conf."
warn = "Permits updating systemd-logind power button handling without password prompt."

[privileges.gaming_mode]
title = "Runtime Posture Manager (nc-posture)"
desc = "Switches Hardened / Gaming posture and updates [posture] tunables via /usr/lib/ncui/sbin/nc-posture."
warn = "Permits adjusting runtime sysctls, /proc hidepid, auditd, and CPU governor."

[privileges.power_fan_profile]
title = "CPU Cooling & Fan Curve Profile (nc-fan-profile)"
desc = "Configures Nuvoton Smart Fan IV preset and custom temperature curves on CPU fans."
warn = "Permits updating hardware PWM auto-point curves on nct67* hwmon without password."

[privileges.snapshot_manage]
title = "Boot Environments & Snapshots (nc-snap)"
desc = "Creates, inspects, extends, deletes, promotes, and configures LVM+UKI / Btrfs boot snapshots via /usr/lib/ncui/sbin/nc-snap."
warn = "Permits managing root/boot snapshots, pacman pre-update hooks, and [snapshots] configuration without password."

[privileges.vault_mount]
title = "Multi-Protocol Vault & Package Lists (nc-vault)"
desc = "Mounts/unmounts SMB, NFS, SSH, or local storage vaults, updates config, and exports package snapshots via /usr/lib/ncui/sbin/nc-vault."
warn = "Permits mounting/unmounting configured vault shares and writing [vault] config or /etc/samba/nas-cred."

[privileges.hanoi_sync]
title = "Tower of Hanoi Encrypted Sync (nc-hanoi)"
desc = "Evaluates drift, pushes/pulls configs, prunes Hanoi history, and manages background sync timer via /usr/lib/ncui/sbin/nc-hanoi."
warn = "Permits syncing system/user tracked files to/from the vault and toggling nc-nas-conf.timer."

[privileges.rescue_manage]
title = "Recovery UKI, Chroot & Golden Images (nc-rescue/chroot/golden)"
desc = "Inspects ESP recovery artifacts, builds/signs Rescue UKI, commits Live RAM SquashFS, scans external LUKS chroot targets, and verifies Golden Image SHA256 checksums."
warn = "Permits updating Recovery UKI, recovery.squashfs, limine.conf entries, and tearing down external LUKS chroot mounts without password prompt."

[privileges.disks_inspect]
title = "Disk Geometry & SMART Diagnostics (nc-disks)"
desc = "Collects physical disk tables, sfdisk partition flags, LVM VG/LV usage, and smartctl NVMe/SATA health and bad sector attributes."
warn = "Permits reading raw block device SMART telemetry and updating /var/lib/ncui/disks-smart.json without password prompt."

