["disp:next:*"]
title = "Sfondo Successivo"
short = "Avanza lo slideshow attivo su questo monitor allo sfondo successivo tramite `nc_util_desktop.sh --next`."

["disp:pause:*"]
title = "Pausa Slideshow"
short = "Sospende la rotazione automatica dello sfondo su questo monitor (`nc_util_desktop.sh --pause`)."

["disp:resume:*"]
title = "Riprendi Slideshow"
short = "Riprende la rotazione automatica dello sfondo su questo monitor (`nc_util_desktop.sh --resume`)."

["disp:set_img:*"]
title = "Imposta Immagine Sfondo.."
short = "Chiede il percorso di un'immagine (con completamento file) e la applica subito su questo monitor."

["disp:matrix:*"]
title = "Avvia NC-Matrix (Verde)"
short = "Avvia lo sfondo live ASCII `nc-matrix` verde su questo monitor (`nc_util_desktop.sh -o <out> -c -C green`)."

["disp:matrix_jp:*"]
title = "Avvia NC-Matrix JP (Katakana)"
short = "Avvia lo sfondo live `nc-matrix` verde con caratteri Katakana giapponesi su questo monitor (`-c -C green -j`)."
