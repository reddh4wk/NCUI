[privileges.uinput_unlock]
title = "Accesso Kernel /dev/uinput (Macro Gaming)"
desc = "Concede permessi di scrittura (0666) su /dev/uinput per le macro hardware."
warn = "Consente al tuo utente di inviare tasti virtuali tramite /dev/uinput senza password."

[privileges.nftables_apply]
title = "Applicazione Regole Firewall nftables"
desc = "Carica /etc/nftables.conf validato nel filtro pacchetti del kernel."
warn = "Consente di ricaricare /etc/nftables.conf nel firewall kernel senza password."

[privileges.nftables_service]
title = "Gestione Servizio Systemd nftables"
desc = "Permette l'avvio e il riavvio di nftables.service tramite systemd."
warn = "Consente l'avvio o il riavvio del servizio nftables senza password interattiva."

[privileges.sbctl_verify]
title = "Verifica Firme Secure Boot & UKI (sbctl)"
desc = "Legge lo stato Secure Boot UEFI e verifica le immagini UKI firmate."
warn = "Concede accesso in sola lettura a sbctl status e verifica firme UEFI."

[privileges.usbguard_inspect]
title = "Gestione Policy USBGuard (nc-usbguard)"
desc = "Elenca, autorizza o blocca i dispositivi USB tramite /usr/lib/ncui/sbin/nc-usbguard."
warn = "Consente lettura dispositivi USB e autorizzazione/blocco USBGuard senza password interattiva."

[privileges.cups_service]
title = "Gestione Servizi di Stampa CUPS & Avahi"
desc = "Permette avvio, arresto, riavvio e abilitazione al boot di cups.service e avahi-daemon.service."
warn = "Consente il controllo dei servizi systemd CUPS e Avahi senza password interattiva."

[privileges.cups_sysgroup]
title = "Iscrizione Utente al Gruppo Admin CUPS (sys, lp)"
desc = "Aggiunge il tuo utente ai gruppi sys e lp per autorizzare nativamente i comandi CUPS locali."
warn = "Concede appartenenza al SystemGroup CUPS locale (attiva al prossimo login)."

[privileges.power_cpu_tune]
title = "Governor Frequenza CPU & Core Boost"
desc = "Consente di cambiare il governor CPU tramite cpupower e attivare/disattivare il boost via sysfs."
warn = "Permette di modificare governor CPU e stato boost senza richiesta password."

[privileges.power_logind]
title = "Comportamento Tasto Accensione (systemd-logind)"
desc = "Scrive la policy HandlePowerKey in /etc/systemd/logind.conf.d/ncui.conf."
warn = "Permette di aggiornare la gestione del tasto di accensione in systemd-logind senza password."

[privileges.gaming_mode]
title = "Gestore Postura Runtime (nc-posture)"
desc = "Commuta Hardened / Gaming e aggiorna [posture] tramite /usr/lib/ncui/sbin/nc-posture."
warn = "Permette di regolare a caldo sysctl, /proc hidepid, auditd e governor CPU."

[privileges.power_fan_profile]
title = "Profilo Curva & Ventole CPU (nc-fan-profile)"
desc = "Configura i preset e le curve termiche personalizzate Smart Fan IV sulle ventole CPU."
warn = "Permette di aggiornare le curve PWM hardware su hwmon nct67* senza password."

[privileges.snapshot_manage]
title = "Ambienti di Avvio & Snapshot (nc-snap)"
desc = "Crea, verifica, estende, elimina, promuove e configura gli snapshot LVM+UKI / Btrfs tramite /usr/lib/ncui/sbin/nc-snap."
warn = "Permette di gestire snapshot root/boot, hook pre-update di pacman e configurazione [snapshots] senza password."

[privileges.vault_mount]
title = "Archivio Vault & Liste Pacchetti (nc-vault)"
desc = "Monta/smonta archivi SMB, NFS, SSH o locali, aggiorna la config ed esporta liste pacchetti tramite /usr/lib/ncui/sbin/nc-vault."
warn = "Permette di montare/smontare gli share configurati e scrivere [vault] o /etc/samba/nas-cred."

[privileges.hanoi_sync]
title = "Sincronizzazione Cifrata Torre di Hanoi (nc-hanoi)"
desc = "Valuta il drift, sincronizza configurazioni, pota lo storico Hanoi e gestisce il timer tramite /usr/lib/ncui/sbin/nc-hanoi."
warn = "Permette di sincronizzare i file tracciati tra sistema e vault e attivare/disattivare nc-nas-conf.timer."

[privileges.rescue_manage]
title = "Recovery UKI, Chroot & Golden Image (nc-rescue/chroot/golden)"
desc = "Ispeziona gli artefatti ESP, compila/firma la Recovery UKI, consolida SquashFS da Live RAM, rileva dischi LUKS per chroot e verifica gli hash SHA256 delle Golden Image."
warn = "Permette di aggiornare Recovery UKI, recovery.squashfs, limine.conf e smontare chroot LUKS esterni senza password."

[privileges.disks_inspect]
title = "Geometria Dischi & Diagnostica SMART (nc-disks)"
desc = "Raccoglie tabelle partizioni, flag sfdisk, utilizzo LVM VG/LV e attributi SMART (temperatura, usura, settori danneggiati) NVMe/SATA."
warn = "Permette di leggere i registri SMART grezzi dai dischi e aggiornare /var/lib/ncui/disks-smart.json senza password."

